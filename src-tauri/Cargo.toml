[package]
name = "multysm-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "multysm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
multysm-core = { path = "../crates/multysm-core" }

[dev-dependencies]
tempfile = "3"
